<!doctype html>
<html lang="en" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lattice">
<meta name="theme-color" content="#f1ece1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
<script>/* set the theme before iOS reads the status-bar colour at launch */try{const t=(JSON.parse(localStorage.getItem('lattice.v1')||'{}').set||{}).theme;if(t==='paper'||t==='ink'){document.documentElement.dataset.theme=t;document.querySelectorAll('meta[name=theme-color]').forEach(m=>{m.removeAttribute('media');m.content=t==='ink'?'#111318':'#f1ece1';});}else if(matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.dataset.theme='ink';}catch(_){}</script>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preload" href="fonts/cormorant.woff2" as="font" type="font/woff2" crossorigin="anonymous">
<title>Lattice</title>
<style>
@font-face{font-family:'Cormorant';src:url(fonts/cormorant.woff2) format('woff2');font-weight:300 700;font-style:normal;font-display:swap}
@font-face{font-family:'Cormorant';src:url(fonts/cormorant-italic.woff2) format('woff2');font-weight:300 700;font-style:italic;font-display:swap}
:root{--serif:'Cormorant',Georgia,'Times New Roman',serif;--sans:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;--ease:cubic-bezier(.2,.8,.2,1);
 --sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);--sal:env(safe-area-inset-left);--sar:env(safe-area-inset-right)}
html[data-theme=paper]{--bg:#f1ece1;--paper:#fbf8f1;--card:#f8f4ea;--ink:#1d1b18;--ink2:#6f685d;--ink3:#a39b8d;--line:#ddd5c5;--line2:#c9bfac;--gold:#a8782a;--goldsoft:rgba(168,120,42,.13);--red:#b8402f;--shade:rgba(29,27,24,.05);color-scheme:light}
html[data-theme=ink]{--bg:#111318;--paper:#181b22;--card:#171a20;--ink:#ece4d2;--ink2:#a49d8f;--ink3:#6c6a66;--line:#2a2e37;--line2:#3a3f4a;--gold:#d9aa5e;--goldsoft:rgba(217,170,94,.14);--red:#e0705e;--shade:rgba(236,228,210,.05);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{font:15px/1.4 var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:transform .38s var(--ease),opacity .38s var(--ease)}
.screen.off-r{transform:translateX(104%);pointer-events:none}
.screen.off-l{transform:translateX(-22%);opacity:.0;pointer-events:none}
.screen.under{transform:translateX(-22%);pointer-events:none}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex:1;min-height:0}
/* ---- home */
#home{flex-direction:row}
.page{flex:1;min-width:0;display:flex;flex-direction:column}
.pin{padding:calc(var(--sat) + 26px) calc(var(--sar) + 22px) calc(var(--sab) + 30px) calc(var(--sal) + 22px);max-width:560px;margin:0 auto;width:100%}
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 22px}
.mast h1{font:600 46px/0.9 var(--serif);margin:0;letter-spacing:.005em}
.mast .tag{font:italic 500 19px/1 var(--serif);color:var(--ink2);margin-top:8px}
.mast .tools{display:flex;gap:4px;margin-bottom:2px}
.ib{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;color:var(--ink2)}
.ib:active{background:var(--shade)}
.card{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:12px;transition:transform .15s}
.card:active{transform:scale(.985)}
.card canvas{flex:none;border-radius:6px}
.card .t1{font:600 22px/1.05 var(--serif)}
.card .t2{color:var(--ink2);font-size:13.5px;margin-top:4px}
.card .t3{color:var(--gold);font-size:13px;margin-top:6px;font-variant-numeric:tabular-nums}
.card .grow{flex:1;min-width:0}
.chev{color:var(--ink3);flex:none}
.week{display:flex;gap:5px;margin-top:8px}
.week i{width:7px;height:7px;border-radius:50%;border:1px solid var(--line2);display:block}
.week i.on{background:var(--gold);border-color:var(--gold)}
.week i.now{border-color:var(--gold)}
h2.sec{font:600 25px/1 var(--serif);margin:30px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
h2.sec span{font:400 13px var(--sans);color:var(--ink2)}
.prow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:11px 4px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.tier{font:600 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin:18px 4px 2px}
.tier:first-child{margin-top:4px}
.prow canvas{flex:none}
.prow .n{font:600 21px/1.1 var(--serif)}
.prow .s{color:var(--ink2);font-size:13px;margin-top:2px}
.prow .c{margin-left:auto;white-space:nowrap;font:500 14px var(--sans);color:var(--ink2);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.prow .c.full{color:var(--gold)}
.prow.sel{background:var(--goldsoft);border-radius:12px;border-bottom-color:transparent}
.endless{padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:46px;height:38px;border-radius:10px;border:1px solid var(--line);font-size:14px;color:var(--ink2);font-variant-numeric:tabular-nums}
.seg button.on{border-color:var(--gold);color:var(--ink);background:var(--goldsoft)}
.endless .lab{font-size:12.5px;color:var(--ink2);margin:0 0 7px}
.endless .lab+.seg{margin-bottom:14px}
.big{width:100%;height:48px;border-radius:13px;background:var(--ink);color:var(--paper);font:600 16px var(--sans);display:flex;align-items:center;justify-content:center;gap:8px}
.big:active{opacity:.85}
.big.ghost{background:none;color:var(--ink);border:1px solid var(--line2)}
.foot{margin-top:28px;color:var(--ink3);font:italic 15px var(--serif);text-align:center}
/* ---- collection */
.bar{display:flex;align-items:center;gap:6px;padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 6px calc(var(--sal) + 6px);min-height:52px}
.back{display:flex;align-items:center;gap:2px;height:42px;padding:0 10px 0 4px;border-radius:12px;color:var(--ink2);font-size:15px}
.back:active{background:var(--shade)}
.chead{padding:0 22px 4px}
.chead h3{font:600 36px/1 var(--serif);margin:6px 0 6px}
.chead p{margin:0;color:var(--ink2);font-size:14px}
.bar+.scroll .chead{padding-top:0}
.ptitle{padding-top:calc(var(--sat) + 26px)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 14px;padding:22px 22px calc(var(--sab) + 30px)}
.tile{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
.tile canvas{width:100%;aspect-ratio:1;border-radius:10px;background:var(--card);border:1px solid var(--line);display:block}
.tile .nm{font:600 16px/1.1 var(--serif);min-height:18px}
.tile .nm.q{color:var(--ink3);font:italic 500 15px var(--serif)}
.tile .sz{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums;margin-top:-4px}
.tile .sz b{color:var(--gold);font-weight:500}
.tile:active canvas{transform:scale(.97)}
/* ---- play */
#play .bar{gap:2px}
#ptitle{flex:1;text-align:center;min-width:0}
#ptitle .a{font:600 21px/1.05 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ptitle .b{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;margin-top:2px}
#timer{min-width:64px;text-align:right;font:500 14px var(--sans);color:var(--ink2);font-variant-numeric:tabular-nums;padding-right:4px}
#body{flex:1;min-height:0;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0;touch-action:none}
html.land #stage{margin-bottom:calc(var(--sab) + 8px)}/* keep the board clear of the home-bar swipe */
#bHint{display:none!important}
.hintb{margin:0 0 8px}.hintb span{color:var(--ink2);font-weight:400}
#cv{position:absolute;left:0;top:0;touch-action:none}
#tools{flex:none;padding:8px calc(var(--sar) + 14px) calc(var(--sab) + 12px) calc(var(--sal) + 14px);display:flex;flex-direction:column;gap:10px}
.trow{display:flex;align-items:center;gap:10px;justify-content:center}
#pal{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.chip{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;border:1.5px solid transparent;position:relative;transition:transform .15s var(--ease)}
.chip i{width:30px;height:30px;border-radius:8px;display:block}
.chip.x i{display:grid;place-items:center;border:1px solid var(--line2)}
.chip.on{border-color:var(--gold);transform:translateY(-2px)}
.chip .cnt{position:absolute;bottom:-3px;right:-3px;font:600 10px var(--sans);background:var(--bg);color:var(--ink2);border-radius:6px;padding:0 3px;font-variant-numeric:tabular-nums}
.act{display:flex;gap:6px;justify-content:center}
.act .ib{width:52px;height:44px;color:var(--ink)}
.act .ib[disabled]{color:var(--ink3);opacity:.5}
.act .ib .k{font:600 10px var(--sans);color:var(--gold);position:absolute;margin:-22px 0 0 26px}
#mist{font-size:12.5px;color:var(--red);text-align:center;min-height:0;font-variant-numeric:tabular-nums}
/* landscape: tools down the trailing side */
html.land #body{flex-direction:row}
html.land #tools{width:150px;padding:8px calc(var(--sar) + 14px) calc(var(--sab) + 12px) 8px;justify-content:center}
html.land #pal{display:grid;grid-template-columns:repeat(2,46px);justify-content:center}
html.land .act{flex-wrap:wrap}
html.land .act .ib{width:44px}
/* ---- overlays */
#veil{position:fixed;inset:0;background:rgba(10,10,12,.32);opacity:0;pointer-events:none;transition:opacity .3s}
#veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:86%;background:var(--paper);border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .36s var(--ease);display:flex;flex-direction:column;border-top:1px solid var(--line);box-shadow:0 -10px 40px rgba(0,0,0,.12)}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line2);margin:9px auto 2px}
.sheet .in{padding:8px 22px calc(var(--sab) + 26px)}
.sheet h4{font:600 28px/1 var(--serif);margin:10px 0 16px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.opt .l{font-size:15px}
.opt .d{font-size:12.5px;color:var(--ink2);margin-top:2px}
.tog{width:50px;height:30px;border-radius:15px;background:var(--line2);position:relative;flex:none;transition:background .2s}
.tog:after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s var(--ease)}
.tog.on{background:var(--gold)}
.tog.on:after{transform:translateX(20px)}
.opt .seg{flex:none}
.opt .seg button{flex:none;padding:0 12px;height:32px}
.opt.col{flex-direction:column;align-items:stretch}
.opt.col .seg button{flex:1}
.opt.hide{display:none}
.rng{width:170px;accent-color:var(--gold)}
.lnk{color:var(--gold);font-size:15px;padding:8px 0 8px 12px;flex:none}
.bkinfo{color:var(--ink2);font-size:14px;margin:0 0 12px}
.bkrow{width:100%;text-align:left}
.bkrow .go{color:var(--gold);font-size:15px;flex:none}
.bkbtns{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.danger{display:block;width:100%;text-align:left;color:var(--red);font-size:15px;padding:14px 0}
.danger+.danger{border-top:1px solid var(--line)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.stat b{display:block;font:600 30px/1 var(--serif);font-variant-numeric:lining-nums}
.stat span{font-size:12.5px;color:var(--ink2)}
.pbars{margin-top:18px}
.pbar{display:flex;align-items:center;gap:10px;font-size:13.5px;margin:9px 0}
.pbar .nm{width:110px;color:var(--ink2)}
.pbar .tr{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.pbar .tr i{display:block;height:100%;background:var(--gold)}
.pbar .v{width:44px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
#done{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .5s}
#done.on{opacity:1;pointer-events:auto}
#done .frame{width:min(360px,84vw);text-align:center;transform:translateY(16px);transition:transform .6s var(--ease)}
#done.on .frame{transform:none}
#done canvas{display:block;margin:0 auto 18px;border-radius:4px}
#done .nm{font:600 40px/1 var(--serif)}
#done .sub{font:italic 500 18px var(--serif);color:var(--ink2);margin-top:6px}
#done .row{display:flex;justify-content:center;gap:22px;margin:16px 0 22px;font-variant-numeric:tabular-nums;color:var(--ink2);font-size:14px}
#done .row b{display:block;color:var(--ink);font:600 24px var(--serif);font-variant-numeric:lining-nums tabular-nums}
#done .perfect{color:var(--gold);font:italic 600 18px var(--serif);min-height:22px;margin-bottom:20px}
#done .btns{display:flex;gap:10px}
#done .btns button{flex:1}
#doneBg{position:fixed;inset:0;background:var(--bg);opacity:0;transition:opacity .6s;pointer-events:none}
#doneBg.on{opacity:1;pointer-events:auto}
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 150px);transform:translate(-50%,10px);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:80vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#coach{position:fixed;left:16px;right:16px;bottom:calc(var(--sab) + 14px);margin:0 auto;max-width:400px;background:var(--paper);border:1px solid var(--line2);border-radius:16px;padding:16px 18px;box-shadow:0 10px 30px rgba(0,0,0,.12);opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s;pointer-events:none}
#coach.on{opacity:1;transform:none;pointer-events:auto}
#coach p{margin:0 0 12px;font:500 19px/1.25 var(--serif)}
#coach .nx{display:flex;justify-content:space-between;align-items:center;color:var(--ink2);font-size:13px}
#coach .nx button{color:var(--gold);font-weight:600;font-size:15px;padding:6px 2px}
/* ---- iPhone Duo, opened: two pages on the home screen, with the gutter on the fold */
html.wide #home .page+.page{border-left:1px solid var(--line)}
html.wide #home{gap:0}
html.wide #home .pin{max-width:none;padding-left:calc(var(--sal) + 26px);padding-right:26px}
html.wide #home .page+.page .pin{padding-left:26px;padding-right:calc(var(--sar) + 26px)}
html.wide .tiles{grid-template-columns:repeat(3,1fr);padding:22px 0 30px}
html.wide .chead{padding:0}
html.wide .sheet{left:50%;border-left:1px solid var(--line);border-radius:22px 0 0 0}
html.wide #coach{left:calc(50% + 20px);right:20px;margin:0}
html.wide #done .frame{width:100%;display:grid;grid-template-columns:1fr 1fr;align-items:center}
html.wide #done canvas{margin:0 auto}
html.wide #done .info{padding:0 calc(var(--sar) + 40px) 0 40px}
#sbar{position:fixed;z-index:60;pointer-events:none;background:#24211d;display:none;left:0;right:0;top:0;height:var(--sat)}
html[data-theme=paper] #sbar{display:block}
html.land #sbar{left:auto;bottom:0;height:auto;width:var(--sar)}
html.land.sb-l #sbar{right:auto;left:0;width:var(--sal)}
html.duo.land{--sat:0px}/* status bar is on the side; iOS can report a stale top inset on return from the app switcher */
html.duo-side .bar{padding-top:calc(var(--sat) + 4px)}
html.duo-side .pin{padding-top:calc(var(--sat) + 14px)}
</style>
</head>
<body>
<div id="vprobe" style="position:fixed;left:0;top:0;width:1px;height:100lvh;pointer-events:none;visibility:hidden"></div>
<div id="sbar"></div>
<div id="insprobe" style="position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)"></div>

<section id="home" class="screen">
 <div class="page" id="hp1"><div class="scroll"><div class="pin" id="homeIn"></div></div></div>
 <div class="page hidden" id="hp2"><div class="scroll"><div class="pin" id="packIn2"></div></div></div>
</section>

<section id="pack" class="screen off-r">
 <div class="bar"><button class="back" data-back><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Lattice</button></div>
 <div class="scroll"><div id="packIn"></div></div>
</section>

<section id="play" class="screen off-r">
 <div class="bar">
  <button class="back" id="pback"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span id="pbackL"></span></button>
  <div id="ptitle"><div class="a" id="pa"></div><div class="b" id="pb"></div></div>
  <div id="timer"></div>
  <button class="ib" id="pmenu" aria-label="Options"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="19" cy="12" r="1.2" fill="currentColor"/></svg></button>
 </div>
 <div id="body">
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="tools">
   <div id="mist"></div>
   <div id="pal"></div>
   <div class="act">
    <button class="ib" id="bUndo" aria-label="Undo"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg></button>
    <button class="ib" id="bRedo" aria-label="Redo"><svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 000 11H13"/></svg></button>
    <button class="ib" id="bHint" aria-label="Hint" hidden><svg class="i" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0012 3z"/></svg></button>
    <button class="ib" id="bFit" aria-label="Fit board"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
   </div>
  </div>
 </div>
</section>

<div id="doneBg"></div>
<div id="done"><div class="frame">
 <canvas id="dcv"></canvas><div class="info">
 <div class="nm" id="dnm"></div>
 <div class="sub" id="dsub"></div>
 <div class="row"><div><b id="dtime"></b>time</div><div><b id="dbest"></b>best</div><div><b id="dmis"></b>mistakes</div></div>
 <div class="perfect" id="dperf"></div>
 <div class="btns"><button class="big ghost" id="dback">Collection</button><button class="big" id="dnext">Next</button></div>
</div></div></div>

<div id="veil"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div class="scroll"><div class="in" id="sheetIn"></div></div></div>
<div id="toast"></div>
<div id="coach"><p id="coachT"></p><div class="nx"><span id="coachN"></span><button id="coachB">Next</button></div></div>

<script src="solver.js"></script>
<script src="puzzles.js"></script>
<script>
'use strict';
const BUILD='2026-10-28.2';
const Q=new URLSearchParams(location.search);
const $=id=>document.getElementById(id);
const PACKS=window.LATTICE_PACKS||[];
const ALPH='0123456789abcdefghijklmnopqrstuvwxyz';

function thumb(q,size,mode){// mode: 'pic' solved picture, 'prog' the player's marks, 'blank'

 if(thumbCache.has(key))return thumbCache.get(key);

  const step=q.w>=15?5:1;for(let i=0;i<=q.w;i+=step){const X=ox+i*cell+.5;x.moveTo(X,oy);x.lineTo(X,oy+bh);}for(let j=0;j<=q.h;j+=step){const Y=oy+j*cell+.5;x.moveTo(ox,Y);x.lineTo(ox+bw,Y);}x.stroke();

function ago(ms){const m=Math.round((Date.now()-ms)/60000);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':new Date(ms).toLocaleDateString(undefined,{month:'short',day:'numeric'});}
const devName=d=>({duo:'iPhone Duo',iphone:'iPhone',ipad:'iPad',browser:'a browser'})[d.split('-')[0]]||d;
async function bkList(){const r=await fetch('/saves/'+BK_APP+'/',{cache:'no-store'});if(!r.ok)throw 0;const l=await r.json();
 return Promise.all(l.map(async e=>{try{const s=await (await fetch('/saves/'+BK_APP+'/'+e.device,{cache:'no-store'})).json();return Object.assign(e,{s,n:solvedIn(s),me:e.device===bkDevice()});}catch(_){return null;}})).then(a=>a.filter(Boolean));}
function bkRestore(e){const keep=S.set;S=Object.assign(blank(),e.s);S.set=keep;delete S.v2g;dropOldGivens();save(true);bkSent='';closeSheet();if(G)leavePlay();cur='play';show('home',true);renderHome();toast('Restored · '+e.n+' solved');}
function openRestore(){openSheet(async o=>{o.append(el('h4','','Restore'));const info=el('div','bkinfo','Looking on the NAS…');o.append(info);
 let l;try{l=await bkList();}catch(_){info.textContent='The NAS can’t be reached. Restore works at home or on the tailnet.';return;}
 if(!l.length){info.textContent='No backups yet.';return;}info.textContent='Replaces the progress on this device. Your settings stay as they are.';
 l.forEach(e=>{const b=el('button','opt bkrow',`<div><div class="l">${devName(e.device)}${e.me?' · this one':''}</div><div class="d">${e.n} solved · saved ${ago(e.saved)}</div></div><span class="go">Restore</span>`);
  b.onclick=()=>{if(!confirm('Replace this device’s progress with the backup from '+devName(e.device)+' ('+e.n+' solved)?'))return;bkRestore(e);};o.append(b);});});}
// a fresh install (nothing solved, nothing started) offers the newest backup once
async function bkOffer(){if(!BK_ON||Q.get('test')||localStorage.getItem('lattice.bkoffer')||solvedIn(S)||Object.keys(S.prog).length)return;
 let l;try{l=await bkList();}catch(_){return;}const e=l.filter(x=>x.n>0)[0];if(!e)return;try{localStorage.setItem('lattice.bkoffer','1');}catch(_){}
 openSheet(o=>{o.append(el('h4','','Welcome back'));o.append(el('div','bkinfo',`There’s a saved game on the NAS from your ${devName(e.device)}: ${e.n} pictures solved, saved ${ago(e.saved)}.`));
  const a=el('button','big','Restore it');a.onclick=()=>bkRestore(e);const b=el('button','big ghost','Start fresh');b.onclick=closeSheet;const w=el('div','bkbtns');w.append(a,b);o.append(w);});}

// ---------------------------------------------------------------- sheets
function openSheet(build){const o=$('sheetIn');o.innerHTML='';build(o);$('sheet').classList.add('on');$('veil').classList.add('on');$('sheet').querySelector('.scroll').scrollTop=0;}
function closeSheet(){$('sheet').classList.remove('on');$('veil').classList.remove('on');}
$('veil').onclick=closeSheet;
(()=>{let y0=null;const sh=$('sheet');sh.addEventListener('touchstart',e=>{if(e.target.closest('.grab'))y0=e.touches[0].clientY;},{passive:true});sh.addEventListener('touchmove',e=>{if(y0!==null&&e.touches[0].clientY-y0>60){y0=null;closeSheet();}},{passive:true});sh.addEventListener('touchend',()=>y0=null);})();
function togRow(o,label,desc,key,after){const r=el('div','opt'),l=el('div','',`<div class="l">${label}</div>${desc?`<div class="d">${desc}</div>`:''}`),t=el('button','tog'+(S.set[key]?' on':''));t.setAttribute('role','switch');t.setAttribute('aria-checked',S.set[key]);
 t.onclick=()=>{S.set[key]=!S.set[key];t.classList.toggle('on',S.set[key]);haptic();save();after&&after();};r.append(l,t);o.append(r);}
function openSettings(){openSheet(o=>{o.append(el('h4','','Settings'));
 // the hint lives here, off the board, so a swipe up to switch apps can't use one
 if(G&&!G.done){const h=el('button','big ghost hintb','Show a hint'+(G.hints?` <span>· ${G.hints} used</span>`:''));h.onclick=()=>{closeSheet();setTimeout(()=>$('bHint').onclick(),280);};o.append(h);}
 const r=el('div','opt');r.append(el('div','l','Appearance'));const sg=el('div','seg');[['auto','Auto'],['paper','Paper'],['ink','Ink']].forEach(([k,l])=>{const b=el('button',S.set.theme===k?'on':'',l);b.onclick=()=>{S.set.theme=k;save();applyTheme();haptic();sg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));renderHome();};sg.append(b);});r.append(sg);o.append(r);
 togRow(o,'Check as I go','A wrong square is corrected at once and counted as a mistake','check',()=>{if(G)updUI();});
 togRow(o,'Cross finished lines','Fills the rest of a solved row or column with crosses','autox');
 togRow(o,'Sound','','sound');
 togRow(o,'Sound when the phone is on silent','','silent',()=>{try{if(navigator.audioSession)navigator.audioSession.type=S.set.silent?'playback':'ambient';}catch(_){}});
 togRow(o,'Haptics','','haptic');
 {const r=el('div','opt col'),l=el('div','',`<div class="l">Ambience</div><div class="d">Quiet background sound while you play</div>`),sg=el('div','seg');AMB.forEach(([k,n])=>{const b=el('button',S.set.amb===k?'on':'',n);b.onclick=()=>{S.set.amb=k;save();haptic();sg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));vr.classList.toggle('hide',k==='off');ambStart();};sg.append(b);});const vr=el('div','opt'+(S.set.amb==='off'?' hide':''),'<div class="l">Ambience volume</div>'),v=document.createElement('input');v.type='range';v.min=0;v.max=1;v.step=.05;v.value=S.set.ambv;v.className='rng';v.oninput=()=>{S.set.ambv=+v.value;ambLevel();};v.onchange=()=>save();vr.append(v);r.append(l,sg);o.append(r,vr);}
 if(BK_ON){const r=el('div','opt'),d=el('div','',`<div class="l">Backup</div><div class="d">${bkLast?'Saved to the NAS '+ago(bkLast):'Not backed up yet'}</div>`),b=el('button','lnk','Restore…');b.onclick=()=>{haptic();openRestore();};r.append(d,b);o.append(r);}
 if(G&&!G.done){const b=el('button','danger','Restart this picture');b.onclick=()=>{if(!confirm('Clear this picture and its timer?'))return;const q=G.q;delete S.prog[q.id];save(true);closeSheet();startPuzzle(q,lastFrom);};o.append(b);}
 const z=el('button','danger','Erase all progress');z.onclick=()=>{if(!confirm('Erase every solved picture, streak and statistic?'))return;if(!confirm('This can’t be undone. Erase everything?'))return;const keep=S.set;S=blank();S.set=keep;S.coach=true;save(true);closeSheet();if(G)leavePlay();$('play').classList.add('off-r');$('pack').classList.add('off-r');cur='play';show('home',true);renderHome();};o.append(z);
 o.append(el('div','foot','Lattice · build '+BUILD));});}
$('pmenu').onclick=()=>{haptic();openSettings();};
function openStats(){openSheet(o=>{o.append(el('h4','','Statistics'));let solved=0,perfect=0,time=0;ALL.forEach(q=>{const p=S.prog[q.id];if(p&&p.done){solved++;if(p.perfect)perfect++;time+=p.best||0;}});
 const g=el('div','stats');[[solved+' / '+ALL.length,'pictures solved'],[perfect,'perfect solves'],[S.daily.streak,'day streak'],[S.daily.best,'longest streak'],[S.endless.n,'endless pictures'],[fmtT(S.stats.time),'time solving']].forEach(([b,s])=>g.append(el('div','stat',`<b>${b}</b><span>${s}</span>`)));o.append(g);
 const pb=el('div','pbars');PACKS.forEach(p=>{const d=packDone(p);pb.append(el('div','pbar',`<div class="nm">${p.name}</div><div class="tr"><i style="width:${d/p.puzzles.length*100}%"></i></div><div class="v">${d} / ${p.puzzles.length}</div>`));});o.append(pb);});}
let toastTm=0;function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toastTm);toastTm=setTimeout(()=>e.classList.remove('on'),2400);}

// ---- first-puzzle coach: three short cards
const COACH=['Each number is a run of filled squares, in order, with at least one gap between runs.','Tap or drag to fill. Choose the cross to mark squares you know are empty.','Finished numbers fade. Satisfy every row and column to reveal the picture.'];
let coachI=0;function coach(){coachI=0;$('coach').classList.add('on');coachShow();}
function coachShow(){$('coachT').textContent=COACH[coachI];$('coachN').textContent=(coachI+1)+' of '+COACH.length;$('coachB').textContent=coachI<COACH.length-1?'Next':'Start';}
$('coachB').onclick=()=>{haptic();coachI++;if(coachI>=COACH.length){$('coach').classList.remove('on');S.coach=true;save();}else coachShow();};

// ---------------------------------------------------------------- updates: reload onto a new build when it's safe
async function checkVersion(){try{if(cur==='play'&&G&&!G.done)return;const r=await fetch('./index.html?vc='+Date.now(),{cache:'no-store'});const t=await r.text();const m=t.match(/const BUILD='([^']+)'/);if(m&&m[1]!==BUILD){persist();save(true);location.reload();}}catch(_){}}
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});

// ---------------------------------------------------------------- boot
TH=readTheme();measure();applyTheme();lastWide=document.documentElement.classList.contains('wide');renderHome();setTimeout(bkOffer,1200);
if(document.fonts&&document.fonts.load){document.fonts.load('600 40px Cormorant').then(()=>{if(cur==='home')renderHome();});}
setTimeout(diag,1500);setTimeout(checkVersion,4000);
window.__G=()=>G;window.__lat=()=>({cur,G:G&&{id:G.q.id,z:G.z,s0:L.s0,L,t:G.t,done:G.done},W,H,duoPose,errs:window.__errs});
// test hooks: ?play=<id>|daily|endless  &solve=1 (all but one cell)  &view=settings|stats
setTimeout(()=>{const p=Q.get('play');if(p){let q=p==='daily'?dailyPuzzle(todayKey()):p==='endless'?(S.endless.cur={w:+(Q.get('w')||15),h:+(Q.get('w')||15),c:+(Q.get('c')||1),seed:12345},endlessPuzzle()):byId(p);if(q){if(q.pack)packSel=q.pack;startPuzzle(q,'home');
  if(Q.get('solve')){const n=+Q.get('solve');let left=0;for(let i=0;i<G.n;i++){if(left<n&&G.sol[i]>0&&i>G.n/2){left++;continue;}G.st[i]=G.sol[i]>0?G.sol[i]:(Q.get('solve')==='9'?-1:0);}updLines(true);draw();}
  if(Q.get('zoom')){G.z=+Q.get('zoom');clampView();draw();}}}
 const v=Q.get('view');if(v==='settings')openSettings();if(v==='stats')openStats();
 const pk=Q.get('pack');if(pk){const pp=PACKS.find(x=>x.id===pk);if(pp){packSel=pp;if(isWide())renderHome();else{renderPack($('packIn'),pp);show('pack');}}}},10);
